services:
  - type: web
    name: donutbase-search
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DONUT_API_KEY
        sync: false          # paste your key in the Render dashboard (run /api in-game on DonutSMP)
      - key: SESSION_SECRET
        generateValue: true  # Render creates a random secret for you
